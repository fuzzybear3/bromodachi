[package]
name = "bromodachi"
version = "2.0.0"
edition = "2021"
description = "Pixel buddy daemon that quizzes you on Japanese (Supabase-backed)"

[dependencies]
anyhow = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
